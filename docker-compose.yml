version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  mcp-server-postgres:
    image: mcp/postgres
    depends_on:
      - postgres
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
    command: ${POSTGRES_URL}
    restart: on-failure

volumes:
  pgdata:
